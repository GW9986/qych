<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>车源管理后台</title>
<style>
  :root{
    --ink:#15161a; --ink-2:#3d4048; --muted:#8a8d96; --line:#e9e7e3;
    --bg:#f5f4f2; --card:#fff; --accent:#c9541f; --accent-soft:#fdf0e9;
    --ok:#1a7f52; --warn:#a8760a; --danger:#b3352c;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  a{color:inherit;text-decoration:none}
  [hidden]{display:none !important}

  /* 登录 */
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:28px 26px}
  .auth-card h1{margin:0 0 6px;font-size:20px}
  .auth-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
  .auth-card label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
  .auth-card input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 12px;margin:0 0 14px;background:#fafaf9}
  .auth-card input:focus{outline:none;border-color:#c9c4bc}
  .auth-card button{width:100%;height:44px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
  .auth-msg{margin-top:12px;font-size:12.5px;color:var(--danger);min-height:18px}

  /* 布局 */
  .shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:18px 20px 16px;font-weight:700;font-size:15px;
    border-bottom:1px solid var(--line)}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
  nav button{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;
    font-size:13.5px;color:var(--ink-2);text-align:left;width:100%}
  nav button:hover{background:#f7f6f4}
  nav button.on{background:var(--ink);color:#fff}
  nav button .n{margin-left:auto;font-size:11.5px;opacity:.6}
  .me{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .me b{display:block;color:var(--ink);font-size:13.5px;font-weight:600}
  .me .role{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:#a5431a;font-size:11.5px}
  .me button{margin-top:10px;font-size:12px;color:var(--muted);text-decoration:underline}
  .me .me-links{display:flex;gap:12px;margin-top:10px}
  .me .me-links button{margin:0}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);
    background:rgba(245,244,242,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .topbar h1{margin:0;font-size:17px;font-weight:700}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .content{padding:20px 24px 60px}

  /* 通用控件 */
  .btn{height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
  .btn:hover{border-color:#d8d3ca}
  .btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.ghost{border-color:transparent;background:#eeede9}
  .btn.danger{color:var(--danger);border-color:#efd8d5}
  .btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
  .input,select.input{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--card)}
  .input:focus{outline:none;border-color:#c9c4bc}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{margin:0;font-size:14px;font-weight:600}
  .panel-head .right{margin-left:auto;display:flex;gap:8px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px solid #f1efeb;vertical-align:middle}
  th{font-size:12px;font-weight:600;color:var(--muted);background:#fbfaf9;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
  .tbl-wrap{max-height:calc(100vh - 260px);overflow:auto}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;white-space:nowrap}
  .pill.on{background:#e7f5ee;color:var(--ok)}
  .pill.reserved{background:var(--accent-soft);color:#a5431a}
  .pill.sold{background:#eef0f3;color:#5b6270}
  .pill.draft{background:#fbf3e1;color:var(--warn)}
  .pill.off{background:#f6eceb;color:var(--danger)}

  .thumb{width:56px;height:42px;border-radius:7px;object-fit:cover;background:#f1efec}
  .row-acts{display:flex;gap:6px;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .k{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .v.accent{color:var(--accent)}
  .stat .v.ok{color:var(--ok)}
  @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* 弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(15,16,19,.5);z-index:50;display:flex;
    align-items:center;justify-content:center;padding:24px}
  .modal{background:var(--card);width:min(760px,100%);max-height:90vh;border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-head button{margin-left:auto;font-size:18px;line-height:1;color:var(--muted);padding:4px}
  .modal-body{padding:18px 20px;overflow:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .form-grid .full{grid-column:1/-1}
  .fi label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fi input,.fi select,.fi textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;background:#fafaf9;font-size:13.5px}
  .fi textarea{height:84px;padding:8px 10px;resize:vertical;line-height:1.6}
  .fi input:focus,.fi textarea:focus{outline:none;border-color:#c9c4bc;background:#fff}

  .img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .img-cell{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:#f1efec}
  .img-cell img{width:100%;height:100%;object-fit:cover}
  .img-cell .x{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .img-cell .cover{position:absolute;left:5px;bottom:5px;font-size:10.5px;padding:1px 6px;border-radius:4px;
    background:rgba(0,0,0,.62);color:#fff}
  .img-cell .setcover{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;
    padding:4px 0;text-align:center;opacity:0;transition:opacity .15s}
  .img-cell:hover .setcover{opacity:1}
  .drop{border:1.5px dashed #d8d3ca;border-radius:10px;padding:18px;text-align:center;color:var(--muted);
    font-size:12.5px;background:#fbfaf9;cursor:pointer}
  .drop:hover{border-color:#c0b9ae;background:#f8f7f5}

  .kvline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eeece7;font-size:13px}
  .kvline:last-child{border-bottom:none}
  .kvline b{font-variant-numeric:tabular-nums}
  .profit-pos{color:var(--ok)}
  .profit-neg{color:var(--danger)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .matrix{width:100%;border-collapse:collapse;font-size:12.5px}
  .matrix th,.matrix td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1efeb}
  .matrix td:first-child,.matrix th:first-child{text-align:left}
  .matrix .yes{color:var(--ok);font-weight:600}
  .matrix .no{color:#d5d2cc}

  .empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px}
  .only-sm{display:none}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s, transform .2s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
    .brand{border-bottom:none;padding:12px 14px;white-space:nowrap}
    nav{flex-direction:row;padding:8px}
    nav button{width:auto;white-space:nowrap}
    .me{margin:0;border:none;padding:10px 14px;white-space:nowrap}
    .me b{display:inline}
    .content{padding:14px}
    .topbar{padding:12px 14px}
    .form-grid{grid-template-columns:1fr}
    .img-grid{grid-template-columns:repeat(3,1fr)}
    .tbl-wrap{max-height:none}
  }

  /* 手机端 */
  @media(max-width:640px){
    body{font-size:13.5px}
    input,select,textarea,.input,select.input,.fi input,.fi select,.fi textarea,
    .auth-card input{font-size:16px}
    .shell{grid-template-columns:minmax(0,1fr);align-content:start}
    aside{display:block;overflow:visible;min-width:0}
    .brand{order:1}
    .me{display:none}
    nav{order:3;display:flex;gap:2px;padding:0 8px 8px;overflow-x:auto;min-width:0;
      -webkit-overflow-scrolling:touch}
    .only-sm{display:inline-flex}
    .content{padding:10px 10px 40px}
    .topbar{padding:10px 12px;gap:8px}
    .topbar h1{font-size:15px}
    .topbar .right .hint{display:none}
    nav{padding:6px}
    nav button{padding:8px 10px;font-size:12.5px}
    .brand{padding:10px 12px;font-size:13.5px}
    .stats{grid-template-columns:repeat(2,1fr);gap:8px}
    .stat{padding:11px 12px}
    .stat .v{font-size:16px}
    .panel-head{padding:10px 12px;flex-wrap:wrap;gap:8px}
    .panel-head .right{margin-left:0;width:100%}
    .panel-head .right .input{width:100% !important}
    th,td{padding:9px 10px;font-size:12.5px}
    .tbl-wrap table{width:max-content;min-width:100%}
    .tbl-wrap{-webkit-overflow-scrolling:touch}
    .thumb{width:48px;height:36px}
    .btn{height:34px;padding:0 11px;font-size:13px}
    .btn.sm{height:30px;padding:0 8px;font-size:12px}
    .row-acts{gap:5px}
    .modal-mask{padding:8px}
    .modal{max-height:96vh;border-radius:12px}
    .modal-head{padding:12px 14px}
    .modal-body{padding:14px}
    .modal-foot{padding:12px 14px}
    .img-grid{grid-template-columns:repeat(3,1fr);gap:6px}
    .auth{padding:16px}
    .auth-card{padding:22px 18px}
    .auth-card h1{font-size:18px}
    .kvline{font-size:12.5px}
    .matrix{font-size:12px}
    .matrix th,.matrix td{padding:7px 6px}
    .toast{bottom:22px;font-size:12.5px}
  }
</style>
</head>
<body>

<!-- 登录 -->
<div class="auth" id="loginView">
  <div class="auth-card">
    <h1>车源管理后台</h1>
    <p>员工账号由管理员在数据库中开通</p>
    <label>账号</label>
    <input id="email" type="text" autocomplete="username" placeholder="admin">
    <label>密码</label>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="••••••">
    <button id="loginBtn">登录</button>
    <div class="auth-msg" id="loginMsg"></div>
  </div>
</div>

<!-- 主体 -->
<div class="shell" id="appView" hidden>
  <aside>
    <div class="brand"><span class="dot"></span><span>车源后台</span></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="pageTitle">车源</h1>
      <div class="right" id="topRight"></div>
      <button class="btn sm only-sm" id="pwdSm">密码</button>
      <button class="btn sm only-sm" id="quitSm">退出</button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

};
</script>

<script>
window.addEventListener('error', function (e) {
  var m = document.getElementById('loginMsg');
  if (m) m.textContent = '脚本错误：' + (e.message || '未知错误');
});
if (!window.supabase) {
  document.getElementById('loginMsg').textContent = 'js/supabase.js 没有加载成功，请确认文件完整（应与 js 文件夹同级）';
}
</script>
<script>/* 二手车后台管理 逻辑（数据库字段全中文）
   权限以 员工 + 角色权限 两张表为准，前端只跟着显示 */
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

const S = {
  me: null, role: null, perms: [],
  cars: [], finance: {}, shareholders: [], reitems: [],
  staff: [], roles: [], allPerms: [], rolePerms: [],
  settings: {}, settingRows: [], tab: 'cars', filter: 'all', q: ''
};

const el = id => document.getElementById(id);
const can = p => S.perms.includes(p);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const yuan = v => Number(v || 0);
const wan = v => (Number(v || 0) / 10000).toFixed(2).replace(/\.?0+$/, '') || '0';
const cny = v => '฿' + Number(v || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
const ymd = d => (d ? String(d).slice(0, 10) : '');
const today = () => {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
};

const STATUS = { 在售: 'on', 已预订: 'reserved', 已售: 'sold', 草稿: 'draft' };
const ROLE_LABEL = { 老板: '老板', 店长: '店长', 销售: '销售', 财务: '财务' };

let toastTimer;
function toast(msg) {
  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function fail(e, fallback) {
  console.error(e);
  toast((e && (e.message || e.error_description)) || fallback || '操作失败');
}

/* ---------------- 登录 ---------------- */

/* 账号可以只填前缀（如 admin），自动补成 admin@shop.local（Auth 要求邮箱格式） */
const EMAIL_DOMAIN = '@shop.local';
const EMAIL_DOMAIN2 = '@carshop.th';   // 新建员工用的邮箱域名
const normEmail = v => {
  const s = String(v || '').trim();
  return s.indexOf('@') >= 0 ? s : s + EMAIL_DOMAIN;
};
const loginHint = msg => {
  const s = String(msg || '');
  if (/invalid login credentials/i.test(s)) return '账号或密码不对';
  if (/email not confirmed/i.test(s)) return '这个账号还没确认邮箱，让管理员在后台删掉重建';
  if (/email rate limit/i.test(s)) return '邮件发送太频繁，稍后再试';
  return s;
};
async function signInAny(account, pwd) {
  const raw = String(account || '').trim().toLowerCase();
  const cands = raw.indexOf('@') >= 0 ? [raw] : [raw + EMAIL_DOMAIN, raw + EMAIL_DOMAIN2];
  let last = null;
  for (const email of cands) {
    const { error } = await db.auth.signInWithPassword({ email, password: pwd });
    if (!error) return null;
    last = error;
  }
  return last;
}

el('loginBtn').onclick = async () => {
  const acc = el('email').value;
  const pwd = el('pwd').value;
  if (!String(acc || '').trim() || !pwd) { el('loginMsg').textContent = '请填写账号和密码'; return; }
  el('loginMsg').textContent = '';
  el('loginBtn').disabled = true;
  const err = await signInAny(acc, pwd);
  el('loginBtn').disabled = false;
  if (err) { el('loginMsg').textContent = loginHint(err.message); return; }
  await enter();
};
el('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') el('loginBtn').click(); });

async function enter() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return showLogin();
  const email = (user.email || '').toLowerCase();

  const { data: staffRows, error } = await db.from('员工').select('*');
  if (error) { fail(error); showLogin(); return; }

  const staff = (staffRows || []).find(r => String(r.邮箱 || '').toLowerCase() === email);
  if (!staff) {
    await db.auth.signOut(); showLogin();
    el('loginMsg').textContent = '该邮箱未在员工表中开通，请联系管理员';
    return;
  }
  if (!staff.启用) {
    await db.auth.signOut(); showLogin();
    el('loginMsg').textContent = '该账号已停用';
    return;
  }

  S.me = staff;
  S.role = staff.角色代码;

  const { data: rp } = await db.from('角色权限').select('*');
  S.perms = (rp || []).filter(r => r.角色代码 === staff.角色代码).map(r => r.权限代码);

  el('loginView').hidden = true;
  el('appView').hidden = false;
  try {
    await loadAll();
  } catch (e) {
    fail(e, '数据加载失败，请检查数据库脚本是否已执行');
    el('appView').hidden = true;
    el('loginView').hidden = false;
    return;
  }
  buildNav();
  renderTab();
}

function showLogin() {
  el('appView').hidden = true;
  el('loginView').hidden = false;
}

async function signOut() { await db.auth.signOut(); location.reload(); }

/* ---------------- 数据 ---------------- */

async function loadAll() {
  const { data: cars, error } = await db.from('车源').select('*');
  if (error) throw error;
  S.cars = (cars || []).slice()
    .sort((a, b) => new Date(b.创建时间) - new Date(a.创建时间));

  const { data: setRows } = await db.from('门店信息').select('*');
  S.settingRows = setRows || [];
  S.settings = Object.fromEntries(S.settingRows.map(r => [r.项目, r.内容]));

  if (can('查看车源') || can('查看财务')) {
    const { data: re } = await db.from('整备明细').select('*');
    S.reitems = re || [];
  }
  if (can('查看财务')) {
    const { data: f } = await db.from('车辆成本').select('*');
    S.finance = Object.fromEntries((f || []).map(x => [x.id, x]));
    const { data: sh } = await db.from('股东').select('*');
    S.shareholders = (sh || []).slice().sort((a, b) => (a.排序 || 0) - (b.排序 || 0));
  }
}

async function loadStaffMeta() {
  const { data: roles } = await db.from('角色').select('*');
  S.roles = roles || [];
  const { data: perms } = await db.from('权限').select('*');
  S.allPerms = perms || [];
  const { data: rp } = await db.from('角色权限').select('*');
  S.rolePerms = rp || [];
  const { data: st } = await db.from('员工').select('*');
  S.staff = (st || []).slice().sort((a, b) => new Date(a.创建时间) - new Date(b.创建时间));
}

const carById = id => S.cars.find(c => c.id === id);
/* 整备费优先取「整备明细」的合计（明细存在时），否则用成本表里存的数 */
const recOf = c => {
  const items = reItemsOf(c.id);
  if (items.length) return reSum(c.id);
  return yuan((S.finance[c.id] || {}).整备费);
};
const costOf = c => {
  const f = S.finance[c.id];
  if (!f) return reSum(c.id);
  return yuan(f.采购价) + recOf(c) + yuan(f.其他费用);
};
const hasCost = c => !!S.finance[c.id];
const profitOf = c => (c.成交价 == null ? null : yuan(c.成交价) - costOf(c));

/* 整备明细：按车号取列表 / 合计 */
const reItemsOf = carId => (S.reitems || []).filter(r => r.车源id === carId)
  .sort((a, b) => String(b.日期 || '').localeCompare(String(a.日期 || '')) || ((b.id || 0) - (a.id || 0)));
const reSum = carId => reItemsOf(carId).reduce((s, r) => s + yuan(r.金额), 0);

/* ---------------- 导航 ---------------- */

const TABS = [
  { key: 'cars', label: '车源', need: '查看车源' },
  { key: 'sold', label: '已售利润', need: '查看车源' },
  { key: 'soldbak', label: '已售备份', need: '查看车源' },
  { key: 'finance', label: '整备明细', need: '查看财务' },
  { key: 'myre', label: '个人花费', need: '查看车源' },
  { key: 'staff', label: '员工权限', need: '员工管理' },
  { key: 'settings', label: '门店设置', need: '门店设置' }
];

function buildNav() {
  const vis = TABS.filter(t => can(t.need));
  if (!vis.some(t => t.key === S.tab)) S.tab = vis[0] ? vis[0].key : 'cars';
  el('nav').innerHTML = vis.map(t =>
    `<button data-tab="${t.key}" class="${t.key === S.tab ? 'on' : ''}">
       ${t.label}<span class="n">${
         t.key === 'cars' ? S.cars.filter(c => c.状态 === '在售').length :
         t.key === 'sold' ? S.cars.filter(c => c.状态 === '已售' && !c.已结算).length :
         t.key === 'soldbak' ? S.cars.filter(c => c.状态 === '已售').length :
         t.key === 'myre' ? myItems().length : ''
       }</span>
     </button>`).join('');
  el('nav').querySelectorAll('button').forEach(b => {
    b.onclick = () => { S.tab = b.dataset.tab; buildNav(); renderTab(); };
  });

  el('me').innerHTML = `<b>${esc(S.me.姓名)}</b>
    <div class="me-links"><button id="pwdBtn">修改密码</button><button id="quit">退出登录</button></div>`;
  el('pwdBtn').onclick = pwdForm;
  el('quit').onclick = signOut;
  const qs = document.getElementById('quitSm');
  if (qs) qs.onclick = signOut;
  const ps = document.getElementById('pwdSm');
  if (ps) ps.onclick = pwdForm;
}

function pwdForm() {
  const m = modal({
    title: '修改密码',
    body: `<div class="form-grid">
        <div class="fi full"><label>当前密码</label><input id="cp0" type="password" autocomplete="current-password"></div>
        <div class="fi full"><label>新密码</label><input id="np" type="password" autocomplete="new-password" placeholder="至少 6 位"></div>
        <div class="fi full"><label>再输一次</label><input id="np2" type="password" autocomplete="new-password"></div>
      </div>`,
    footer: `<button class="btn" data-x>取消</button><button class="btn dark" id="ok">保存</button>`,
    width: 420
  });
  m.root.querySelector('[data-x]').onclick = m.close;
  m.root.querySelector('#ok').onclick = async () => {
    const oldP = m.root.querySelector('#cp0').value;
    const a = m.root.querySelector('#np').value.trim();
    const b = m.root.querySelector('#np2').value.trim();
    if (!oldP) { toast('请输入当前密码'); return; }
    if (a.length < 6) { toast('密码至少 6 位'); return; }
    if (a !== b) { toast('两次输入不一致'); return; }
    const btn = m.root.querySelector('#ok');
    btn.disabled = true;
    try {
      const email = String((S.me && S.me.邮箱) || '').toLowerCase();
      const { error: e1 } = await db.auth.signInWithPassword({ email, password: oldP });
      if (e1) { toast('当前密码不对'); btn.disabled = false; return; }
      const { error } = await db.auth.updateUser({ password: a });
      if (error) throw error;
      m.close(); toast('密码已修改');
    } catch (e) { fail(e, '修改失败'); btn.disabled = false; }
  };
}

function setTitle(t) { el('pageTitle').textContent = t; el('topRight').innerHTML = ''; }

function renderTab() {
  const map = { cars: renderCars, sold: renderSold, soldbak: renderSoldBackup, finance: renderFinance, myre: renderMyRe, staff: renderStaff, settings: renderSettings };
  (map[S.tab] || renderCars)();
}

/* ---------------- 车源列表 ---------------- */

function renderCars() {
  setTitle('车源');
  const onSale = S.cars.filter(c => c.状态 === '在售');
  const reserved = S.cars.filter(c => c.状态 === '已预订');
  const sold = S.cars.filter(c => c.状态 === '已售');
  const draft = S.cars.filter(c => c.状态 === '草稿');

  el('topRight').innerHTML = `
    ${can('新增车源') ? '<button class="btn ghost" id="btnImport">批量导入</button>' : ''}
    ${can('新增车源') ? '<button class="btn dark" id="btnNew">新增车源</button>' : ''}`;
  if (el('btnNew')) el('btnNew').onclick = () => carForm(null);
  if (el('btnImport')) el('btnImport').onclick = importForm;

  const list = S.cars.filter(c => {
    if (S.filter !== 'all' && c.状态 !== S.filter) return false;
    if (S.q) {
      const hay = [c.标题, c.编号, c.品牌, c.车型, c.所在地, c.颜色].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(S.q.toLowerCase())) return false;
    }
    return true;
  });

  };
  el('view').querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      const act = b.dataset.act;
      if (act === 'edit') carForm(carById(id));

      if (act === 'sell') sellForm(carById(id));
      if (act === 'restore') restore(carById(id));
      if (act === 're') reDetail(carById(id));

  });

  const saveCar = async (id, patch) => {
    const { error } = await db.from('车源').update(patch).eq('id', id);
    if (error) throw error;

    if (c) Object.assign(c, patch);

function modal({ title, body, footer = '', width = 760 }) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal" style="width:min(${width}px,100%)">
      <div class="modal-head"><h3>${esc(title)}</h3><button data-x>×</button></div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.querySelector('[data-x]').onclick = close;
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  return { root: mask, close, bodyEl: mask.querySelector('.modal-body') };
}

async function compress(file, maxSide = 1600, quality = 0.82) {
  if (!/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 600 * 1024) return file;
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * scale);
    cv.height = Math.round(bmp.height * scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
    if (!blob) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}

function pathFromUrl(url) {
  const marker = '/object/public/car-images/';
  const i = String(url).indexOf(marker);
  return i >= 0 ? decodeURIComponent(String(url).slice(i + marker.length)) : null;
}

async function imageForm(car) {
  if (!car) return;
  const m = modal({
    title: '图片管理 · ' + car.标题,
    body: `<div class="drop" id="drop">点击选择图片（可多选，自动压缩到 1600px）
            <input type="file" id="file" accept="image/*" multiple hidden></div>
          <div class="img-grid" id="grid"><div class="hint">加载中…</div></div>
          <div class="hint">第一张自动作为封面；鼠标移到图片上可「设为封面」。删除会同时删除云端文件。</div>`,
    footer: `<button class="btn dark" data-x3>完成</button>`,
    width: 720
  });
  m.root.querySelector('[data-x3]').onclick = () => { m.close(); loadAll().then(renderCars); };

  const grid = m.root.querySelector('#grid');
  const fileInput = m.root.querySelector('#file');
  m.root.querySelector('#drop').onclick = () => fileInput.click();

  async function refresh() {
    const { data } = await db.from('车辆图片').select('*');
    const imgs = (data || [])
      .filter(i => i.车源id === car.id)
      .sort((a, b) => (a.排序 || 0) - (b.排序 || 0));
    grid.innerHTML = imgs.length ? imgs.map((im, i) => `
      <div class="img-cell">
        <img src="${esc(im.图片地址)}" alt="">
        ${car.封面 === im.图片地址 || (!car.封面 && i === 0) ? '<span class="cover">封面</span>' : ''}
        <button class="x" data-del="${im.id}" data-url="${esc(im.图片地址)}">×</button>
        <button class="setcover" data-cover="${esc(im.图片地址)}">设为封面</button>
      </div>`).join('') : '<div class="hint">还没有图片</div>';

    grid.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('删除这张图片？')) return;
      const p = pathFromUrl(b.dataset.url);
      if (p) await db.storage.from('car-images').remove([p]);
      await db.from('车辆图片').delete().eq('id', b.dataset.del);
      if (car.封面 === b.dataset.url) {
        await db.from('车源').update({ 封面: null }).eq('id', car.id);
        car.封面 = null;
      }
      await refresh(); await loadAll();
    });

    grid.querySelectorAll('[data-cover]').forEach(b => b.onclick = async () => {
      await db.from('车源').update({ 封面: b.dataset.cover }).eq('id', car.id);
      car.封面 = b.dataset.cover;
      await refresh(); await loadAll(); toast('已设为封面');
    });
  }

  fileInput.onchange = async () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    if (!files.length) return;
    grid.innerHTML = '<div class="hint">上传中…</div>';

    const { data: exist } = await db.from('车辆图片').select('*');
    let sort = (exist || []).filter(i => i.车源id === car.id).length;

    for (const raw of files) {
      try {
        const f = await compress(raw);
        const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
        const p = `${car.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await db.storage.from('car-images').upload(p, f, {
          cacheControl: '3600', contentType: f.type || 'image/jpeg', upsert: false
        });
        if (upErr) throw upErr;
        const { data: pub } = db.storage.from('car-images').getPublicUrl(p);
        const { error: dbErr } = await db.from('车辆图片').insert({
          车源id: car.id, 图片地址: pub.publicUrl, 排序: sort++
        });
        if (dbErr) throw dbErr;

        if (!car.封面) {
          await db.from('车源').update({ 封面: pub.publicUrl }).eq('id', car.id);
          car.封面 = pub.publicUrl;
        }
      } catch (e) { fail(e, '上传失败：' + raw.name); }
    }
    await refresh(); await loadAll();
    toast('上传完成');
  };

  await refresh();
}

function sellForm(car) {
  if (!car) return;
  const cost = costOf(car);
  const m = modal({
    title: '登记成交 · ' + car.标题,
    body: `<div class="form-grid">
        <div class="fi"><label>成交价（万泰铢）*</label><input name="成交价" type="number" step="0.01" value="${wan(car.售价)}"></div>
        <div class="fi"><label>成交日期</label><input name="成交日期" type="date" value="${today()}"></div>
        <div class="fi full"><label>备注（买家、付款方式等）</label><input name="买家备注" placeholder=""></div>
      </div>
      ${can('查看财务') ? `<div class="hint">当前成本合计 ${cny(cost)}，若按上面价格成交，毛利约 <b id="pv" class="profit-pos">—</b></div>` : ''}`,
    footer: `<button class="btn" data-x4>取消</button><button class="btn dark" id="ok">确认成交</button>`,
    width: 620
  });
  m.root.querySelector('[data-x4]').onclick = m.close;

  const pv = m.root.querySelector('#pv');
  const inp = m.root.querySelector('[name="成交价"]');
  const paint = () => {
    if (!pv) return;
    const gp = Math.round(Number(inp.value || 0) * 10000) - cost;
    pv.textContent = cny(gp) + (gp > 0 ? '（盈）' : '（亏）');
    pv.className = gp >= 0 ? 'profit-pos' : 'profit-neg';
  };
  inp.oninput = paint; paint();

  m.root.querySelector('#ok').onclick = async () => {
    const w = Number(inp.value);
    if (!w || w <= 0) { toast('请填写成交价'); return; }
    try {
      const { error } = await db.from('车源').update({
        状态: '已售',
        成交价: Math.round(w * 10000),
        成交日期: m.root.querySelector('[name="成交日期"]').value || today(),
        买家备注: m.root.querySelector('[name="买家备注"]').value.trim() || null
      }).eq('id', car.id);
      if (error) throw error;
      m.close(); await loadAll(); renderCars(); toast('已登记成交');
    } catch (e) { fail(e, '操作失败'); }
  };
}

async function restore(car) {
  if (!confirm('恢复到在售？成交记录会被清空。')) return;
  try {
    const { error } = await db.from('车源').update({
      状态: '在售', 成交价: null, 成交日期: null, 买家备注: null
    }).eq('id', car.id);
    if (error) throw error;
    await loadAll(); renderCars(); toast('已恢复在售');
  } catch (e) { fail(e); }
}

async function del(car) {
  if (!confirm('删除「' + car.标题 + '」？图片和成本记录会一并删除，不可恢复。')) return;
  try {
    const { data: imgs } = await db.from('车辆图片').select('*');
    const paths = (imgs || []).filter(i => i.车源id === car.id)
      .map(i => pathFromUrl(i.图片地址)).filter(Boolean);
    if (paths.length) await db.storage.from('car-images').remove(paths);
    const { error } = await db.from('车源').delete().eq('id', car.id);
    if (error) throw error;
    await loadAll(); renderCars(); toast('已删除');
  } catch (e) { fail(e); }
}

              : `<button class="btn sm" data-settlemy="${r.id}">已结算</button>
                 <button class="btn sm" data-delmy="${r.id}">删</button>`}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="${cols}"><div class="empty">${S.reSettled ? '还没有已结算的' : '没有待结算的垫付'}</div></td></tr>`}
        <tr style="background:#fbfaf9"><td colspan="3" style="font-weight:600">合计 ${rows.length} 笔</td>
          <td class="num" style="font-weight:600">${cny(total)}</td><td colspan="${cols - 4}"></td></tr>
        </tbody>
      </table></div>
      <div class="form-grid" style="margin-top:14px;padding:0 16px 16px">
        <div class="fi"><label>哪台车</label><select id="myCar">${S.cars.map(c => `<option value="${c.id}">${esc((c.编号 ? c.编号 + ' ' : '') + c.标题)}</option>`).join('')}</select></div>
        <div class="fi"><label>日期</label><input id="myDate" type="date" value="${today()}"></div>
        <div class="fi"><label>事项 *</label><input id="myItem" placeholder="洗车 / 修车 / 贴膜"></div>
        <div class="fi"><label>金额（฿）*</label><input id="myAmt" type="number" step="0.01" placeholder="200"></div>
        <div class="fi"><label>备注</label><input id="myNote" placeholder="可留空"></div>
      </div>
      <div style="padding:0 16px 16px"><button class="btn dark" id="myAdd">记一笔</button></div>
    </div>`;


  el('myAdd').onclick = async () => {
    const 事项 = el('myItem').value.trim();
    const 金额 = Number(el('myAmt').value || 0);
    if (!事项) { toast('请填写事项'); return; }
    if (!金额) { toast('请填写金额'); return; }
    try {
      const { error } = await db.from('整备明细').insert({
        车源id: el('myCar').value,
        日期: el('myDate').value || today(),
        事项,
        金额,
        经手人: me || null,
        备注: el('myNote').value.trim() || null,
        创建人: me || null
      });
      if (error) throw error;
      await loadAll(); renderMyRe(); toast('已记录');
    } catch (e) { fail(e, '记录失败'); }
  };

  el('view').querySelectorAll('[data-re-set]').forEach(b => {
    b.onclick = () => { S.reSettled = b.dataset.reSet === '1'; renderMyRe(); };
  });
  el('view').querySelectorAll('[data-re-scope]').forEach(b => {
    b.onclick = () => { S.reScope = b.dataset.reScope; renderMyRe(); };
  });

  el('view').querySelectorAll('[data-unsettle]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const { error } = await db.from('整备明细').update({ 已结算: false }).eq('id', Number(b.dataset.unsettle));
        if (error) throw error;
        await loadAll(); renderMyRe(); toast('已撤销');
      } catch (e) { fail(e, '撤销失败'); b.disabled = false; }
    };
  });

  el('view').querySelectorAll('[data-settlemy]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('标记为已结算？标记后这笔不再显示，也不计入合计。')) return;
      b.disabled = true;
      try {
        const { error } = await db.from('整备明细').update({ 已结算: true }).eq('id', Number(b.dataset.settlemy));
        if (error) throw error;
        await loadAll(); renderMyRe(); toast('已结算');
      } catch (e) { fail(e, '结算失败'); b.disabled = false; }
    };
  });

  el('view').querySelectorAll('[data-delmy]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('删除这一笔整备记录？')) return;
      try {
        const { error } = await db.from('整备明细').delete().eq('id', Number(b.dataset.delmy));
        if (error) throw error;
        await loadAll(); renderMyRe(); toast('已删除');
      } catch (e) { fail(e, '删除失败'); }
    };
  });
}

        toast('已保存');
        renderStaff();
      } catch (e) { cb.checked = !want; cb.disabled = false; fail(e, '保存失败'); }

function staffForm(person) {
  const p = person || {};
  const m = modal({
    title: person ? '编辑员工' : '新增员工',
    body: `<div class="form-grid">
        <div class="fi"><label>姓名</label><input name="姓名" value="${esc(p.姓名 || '')}"></div>
        <div class="fi"><label>登录邮箱${person ? '' : '（就是账号）'}</label><input name="邮箱" value="${esc(p.邮箱 || '')}" ${person ? 'readonly style="background:#f2f1ee"' : ''} placeholder="如 aming@carshop.th"></div>
        <div class="fi"><label>角色</label><select name="角色代码">
          ${S.roles.map(r => `<option value="${r.代码}" ${p.角色代码 === r.代码 ? 'selected' : ''}>${esc(r.名称)}</option>`).join('')}</select></div>
        <div class="fi"><label>电话</label><input name="电话" value="${esc(p.电话 || '')}"></div>
        ${person ? '' : `<div class="fi"><label>初始密码（至少 6 位）</label><input name="密码" type="password" autocomplete="new-password" placeholder="设一个，交给对方"></div>
        <div class="fi"><label>&nbsp;</label><div class="hint" style="margin:0">对方登录后可自己改密码</div></div>`}
      </div>`,
    footer: `<button class="btn" data-x6>取消</button><button class="btn dark" id="ok">${person ? '保存' : '创建账号'}</button>`,
    width: 640
  });
  m.root.querySelector('[data-x6]').onclick = m.close;
  m.root.querySelector('#ok').onclick = async () => {
    const g = n => {
      const i = m.root.querySelector(`[name="${n}"]`);
      return i ? i.value.trim() : '';
    };
    const btn = m.root.querySelector('#ok');
    if (!g('姓名') || (!person && !g('邮箱'))) { toast('姓名和邮箱必填'); return; }
    const payload = {
      姓名: g('姓名'),
      角色代码: g('角色代码'),
      电话: g('电话') || null
    };
    btn.disabled = true;
    try {
      if (person) {
        const { error } = await db.from('员工').update(payload).eq('id', person.id);
        if (error) throw error;
      } else {
        const email = g('邮箱').toLowerCase();
        const pwd = g('密码');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('邮箱格式不对'); btn.disabled = false; return; }
        if (/@shop\.local$/.test(email)) { toast('邮箱不能用 @shop.local，换成真实邮箱或 @carshop.th'); btn.disabled = false; return; }
        if (pwd.length < 6) { toast('初始密码至少 6 位'); btn.disabled = false; return; }
        // 用独立的临时客户端建 Auth 账号，不动当前登录态
        const tmp = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
          auth: { persistSession: false, autoRefreshToken: false, storageKey: 'tmp-signup' }
        });
        const { data, error } = await tmp.auth.signUp({ email, password: pwd });
        if (error) throw error;
        const u = data && data.user;
        if (u && Array.isArray(u.identities) && u.identities.length === 0) {
          toast('这个邮箱已有账号，直接登记即可'); btn.disabled = false; return;
        }
        payload.邮箱 = email;
        payload.启用 = true;
        const { error: e2 } = await db.from('员工').insert(payload);
        if (e2) throw e2;
        toast('账号已创建，把邮箱和初始密码给对方');
      }
      m.close(); await renderStaff(); toast('已保存');
    } catch (e) { fail(e, '保存失败'); btn.disabled = false; }
  };
}

function importForm() {
  const m = modal({
    title: '批量导入车源',
    body: `<div class="hint" style="margin-top:0">每行一台车，用逗号或 Tab 分隔（可直接从 Excel 复制粘贴）。列顺序：</div>
      <div class="hint" style="color:var(--ink-2);background:#fbfaf9;border:1px solid var(--line);border-radius:8px;padding:10px">
        车牌号码, 标题, 品牌, 车型, 年份, 里程(万公里), 变速箱, 能源, 排量, 颜色, 所在地, 售价(万泰铢), 新车指导价(万泰铢), 亮点, 描述
      </div>
      <div class="fi" style="margin-top:12px"><textarea id="bulk" style="height:240px;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px" placeholder="2863, 2021款 丰田凯美瑞 2.0G 豪华版, 丰田, 凯美瑞, 2021, 4.2, 自动, 汽油, 2.0L, 白色, 罗勇府, 9.8, 18.9, 一手车、无事故, 车况良好"></textarea></div>
      <div class="hint">空列可以留空，但不能少分隔符；字段内容里不要用英文逗号（改用「、」）。从 Excel 里直接复制粘贴会自动按 Tab 分列。售价按万泰铢填。导入后默认「在售」，图片逐台补传。</div>`,
    footer: `<button class="btn" data-x7>取消</button><button class="btn dark" id="ok">开始导入</button>`,
    width: 760
  });
  m.root.querySelector('[data-x7]').onclick = m.close;
  m.root.querySelector('#ok').onclick = async () => {
    const raw = m.root.querySelector('#bulk').value.trim();
    if (!raw) { toast('没有内容'); return; }
    const lines = raw.split(/\r?\n/).filter(l => l.trim());
    const rows = [];
    const nk = v => String(v || '').replace(/\s+/g, '').toUpperCase();
    const seen = {};
    (S.cars || []).forEach(c => { if (c.编号) seen[nk(c.编号)] = c.标题; });
    const dups = [];
    for (const line of lines) {
      const cells = line.split(/\t|,/).map(s => s.trim());
      if (!cells[1] && !cells[0]) continue;
      if (/标题/.test(cells[1] || '')) continue;
      const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
      const plate = cells[0] || null;
      if (plate) {
        const k = nk(plate);
        if (seen[k]) { dups.push(plate); continue; }
        seen[k] = cells[1] || '未命名车源';
      }
      rows.push({
        编号: plate,
        标题: cells[1] || '未命名车源',
        品牌: cells[2] || null,
        车型: cells[3] || null,
        年份: num(cells[4]),
        里程: num(cells[5]),
        变速箱: cells[6] || null,
        能源: cells[7] || null,
        排量: cells[8] || null,
        颜色: cells[9] || null,
        所在地: cells[10] || '罗勇府',
        售价: Math.round(Number(cells[11] || 0) * 10000),
        指导价: num(cells[12]),
        亮点: cells[13] || null,
        描述: cells[14] || null,
        状态: '在售',
        创建人: (S.me && S.me.id) || null
      });
    }
    if (!rows.length) { toast(dups.length ? '这些车牌号码已存在，未导入：' + dups.join('、') : '没有可导入的行'); return; }
    try {
      const { error } = await db.from('车源').insert(rows);
      if (error) throw error;
      m.close(); await loadAll(); renderCars();
      toast('已导入 ' + rows.length + ' 台' + (dups.length ? '，跳过重复车牌 ' + dups.length + ' 个：' + dups.join('、') : ''));
    } catch (e) { fail(e, '导入失败'); }
  };
}

/* ---------------- 启动 ---------------- */

(async function init() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) await enter();
  } catch (e) { console.warn(e); }
})();
</script>
